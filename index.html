<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- QGIS2Web CSS -->
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
    <link rel="stylesheet" href="css/qgis2web.css">
    <link rel="stylesheet" href="css/fontawesome-all.min.css">
    <link rel="stylesheet" href="css/leaflet.photon.css">

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        /* Make all qgis2web labels fully transparent and readable */
        .leaflet-tooltip.css_Tidepooling_Seattle_2025_1 {
            background-color: transparent !important; /* main background */
            border: none !important;
            box-shadow: none !important;
        }

        .leaflet-tooltip.css_Tidepooling_Seattle_2025_1::before {
            background: transparent !important; /* removes tooltip arrow background */
        }

        .leaflet-tooltip.css_Tidepooling_Seattle_2025_1 * {
            background: transparent !important; 
            color: black !important; 
            text-shadow: 1px 1px 2px white !important;
            font-weight: bold !important;
            padding: 0 !important;
        }
    </style>

    <title>Tidepooling Map</title>
</head>

<body>
    <div id="map"></div>

    <!-- QGIS2Web JS -->
    <script src="js/qgis2web_expressions.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/L.Control.Layers.Tree.min.js"></script>
    <script src="js/leaflet.rotatedMarker.js"></script>
    <script src="js/leaflet.pattern.js"></script>
    <script src="js/leaflet-hash.js"></script>
    <script src="js/Autolinker.min.js"></script>
    <script src="js/rbush.min.js"></script>
    <script src="js/labelgun.min.js"></script>
    <script src="js/labels.js"></script>
    <script src="js/leaflet.photon.js"></script>
    <script src="data/Tidepooling_Seattle_2025_1.js"></script>

    <script>
        var map = L.map('map', { zoomControl:false, maxZoom:28, minZoom:1 })
            .fitBounds([[47.45756983475272,-122.70565902724597],[47.73793755771051,-122.01540776950587]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }

        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() { popup.update(); }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() { popup.setContent(tempDiv.innerHTML); popup.update(); }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    video.addEventListener('loadedmetadata', function() { popup.update(); });
                    setTimeout(function() { popup.setContent(tempDiv.innerHTML); popup.update(); }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        var zoomControl = L.control.zoom({ position: 'topleft' }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {}

        // Google Terrain layer
        map.createPane('pane_GoogleTerrain_0');
        map.getPane('pane_GoogleTerrain_0').style.zIndex = 400;
        var layer_GoogleTerrain_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleTerrain_0',
            opacity: 1.0,
            attribution: '<a href="https://www.google.at/permissions/geoguidelines/attr-guide.html">Map data ©2015 Google</a>',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 20
        });
        map.addLayer(layer_GoogleTerrain_0);

        function pop_Tidepooling_Seattle_2025_1(feature, layer) {
            var popupContent = '<table>\
                <tr><th scope="row">Address</th><td class="visible-with-data" id="Address">' + (feature.properties['Address'] !== null ? autolinker.link(String(feature.properties['Address'])) : '') + '</td></tr>\
                <tr><th scope="row">City</th><td class="visible-with-data" id="City">' + (feature.properties['City'] !== null ? autolinker.link(String(feature.properties['City'])) : '') + '</td></tr>\
                <tr><th scope="row">Subregion</th><td class="visible-with-data" id="Subregion">' + (feature.properties['Subregion'] !== null ? autolinker.link(String(feature.properties['Subregion'])) : '') + '</td></tr>\
                <tr><th scope="row">X</th><td class="visible-with-data" id="X">' + (feature.properties['X'] !== null ? autolinker.link(String(feature.properties['X'])) : '') + '</td></tr>\
                <tr><th scope="row">Y</th><td class="visible-with-data" id="Y">' + (feature.properties['Y'] !== null ? autolinker.link(String(feature.properties['Y'])) : '') + '</td></tr>\
                <tr><th scope="row">IN_SingleL</th><td class="visible-with-data" id="IN_SingleL">' + (feature.properties['IN_SingleL'] !== null ? autolinker.link(String(feature.properties['IN_SingleL'])) : '') + '</td></tr>\
                <tr><th scope="row">Place Name</th><td class="visible-with-data" id="Place Name">' + (feature.properties['Place Name'] !== null ? autolinker.link(String(feature.properties['Place Name'])) : '') + '</td></tr>\
                <tr><th scope="row">USER_Notes</th><td class="visible-with-data" id="USER_Notes">' + (feature.properties['USER_Notes'] !== null ? autolinker.link(String(feature.properties['USER_Notes'])) : '') + '</td></tr>\
            </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function(e) { addClassToPopupIfMedia(content, e.popup); });
            layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Tidepooling_Seattle_2025_1_0() {
            return {
                pane: 'pane_Tidepooling_Seattle_2025_1',
                rotationAngle: 0.0,
                rotationOrigin: 'center center',
                icon: L.icon({ iconUrl: 'markers/Tidepooling_Seattle_2025_1.svg', iconSize: [57,57] }),
                interactive: true
            }
        }

        map.createPane('pane_Tidepooling_Seattle_2025_1');
        map.getPane('pane_Tidepooling_Seattle_2025_1').style.zIndex = 401;
        map.getPane('pane_Tidepooling_Seattle_2025_1').style['mix-blend-mode'] = 'normal';

        var layer_Tidepooling_Seattle_2025_1 = new L.geoJson(json_Tidepooling_Seattle_2025_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Tidepooling_Seattle_2025_1',
            layerName: 'layer_Tidepooling_Seattle_2025_1',
            pane: 'pane_Tidepooling_Seattle_2025_1',
            onEachFeature: pop_Tidepooling_Seattle_2025_1,
            pointToLayer: function (feature, latlng) { return L.marker(latlng, style_Tidepooling_Seattle_2025_1_0(feature)); },
        });

        bounds_group.addLayer(layer_Tidepooling_Seattle_2025_1);
        map.addLayer(layer_Tidepooling_Seattle_2025_1);

        var overlaysTree = [
            {label: '<img src="legend/Tidepooling_Seattle_2025_1.png" /> Tidepooling_Seattle_2025', layer: layer_Tidepooling_Seattle_2025_1},
            {label: "Google Terrain", layer: layer_GoogleTerrain_0},
        ];
        var lay = L.control.layers.tree(null, overlaysTree, { collapsed: true }).addTo(map);
        setBounds();

        var i = 0;
        layer_Tidepooling_Seattle_2025_1.eachLayer(function(layer) {
            layer.bindTooltip(
                (layer.feature.properties['Place Name'] !== null ? '<div style="color: #ffffff; font-size: 10pt; font-family: \'Open Sans\', sans-serif;">' + layer.feature.properties['Place Name'] + '</div>' : ''),
                { permanent: true, offset: [-0, -16], className: 'css_Tidepooling_Seattle_2025_1' }
            );
            labels.push(layer);
            totalMarkers += 1;
            layer.added = true;
            addLabel(layer, i);
            i++;
        });

        resetLabels([layer_Tidepooling_Seattle_2025_1]);
        map.on("zoomend", function(){ resetLabels([layer_Tidepooling_Seattle_2025_1]); });
        map.on("layeradd", function(){ resetLabels([layer_Tidepooling_Seattle_2025_1]); });
        map.on("layerremove", function(){ resetLabels([layer_Tidepooling_Seattle_2025_1]); });
    </script>
</body>
</html>
